<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Brother 🎂</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d9e8ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.8);
            padding: 35px;
            border-radius: 25px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            color: #ff4081;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        /* Cake */
        .cake-area {
            position: relative;
            height: 270px;
        }

        .cake {
            position: absolute;
            left: 50%;
            top: 70px;
            transform: translateX(-50%);
            width: 230px;
            height: 130px;
        }

        .cake-top {
            position: absolute;
            width: 230px;
            height: 55px;
            background: #ff9ac2;
            border-radius: 50%;
            top: 0;
            z-index: 3;
        }

        .cake-body {
            position: absolute;
            width: 220px;
            height: 100px;
            background: #ff6fa8;
            top: 25px;
            left: 5px;
            border-radius: 0 0 25px 25px;
        }

        .cream {
            position: absolute;
            width: 230px;
            height: 30px;
            background: white;
            top: 35px;
            border-radius: 50%;
            z-index: 4;
        }

        /* Candles */
        .candle {
            position: absolute;
            width: 12px;
            height: 45px;
            background: #7c4dff;
            top: -35px;
            z-index: 5;
            border-radius: 5px;
        }

        .candle1 {
            left: 65px;
        }

        .candle2 {
            left: 109px;
        }

        .candle3 {
            left: 153px;
        }

        .flame {
            position: absolute;
            width: 14px;
            height: 20px;
            background: orange;
            border-radius: 50% 50% 50% 50%;
            top: -22px;
            left: -1px;
            animation: flame 0.5s infinite alternate;
        }

        @keyframes flame {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.2);
            }
        }

        /* Knife */
        .knife {
            position: absolute;
            right: 70px;
            top: 100px;
            font-size: 55px;
            cursor: pointer;
            transition: 1s;
            z-index: 10;
        }

        .knife:hover {
            transform: rotate(-15deg) scale(1.1);
        }

        .knife.cutting {
            right: 240px;
            top: 85px;
            transform: rotate(-35deg);
        }

        button {
            border: none;
            padding: 14px 25px;
            font-size: 17px;
            border-radius: 30px;
            background: #ff4081;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,64,129,0.4);
        }

        button:hover {
            background: #e91e63;
            transform: scale(1.05);
        }

        /* Gift */
        .gift {
            display: none;
            margin-top: 10px;
        }

        .gift-box {
            position: relative;
            width: 130px;
            height: 110px;
            margin: auto;
        }

        .box {
            position: absolute;
            bottom: 0;
            width: 130px;
            height: 85px;
            background: #ff4081;
            border-radius: 8px;
        }

        .ribbon-vertical {
            position: absolute;
            width: 22px;
            height: 110px;
            background: #ffd700;
            left: 54px;
            z-index: 2;
        }

        .ribbon-horizontal {
            position: absolute;
            width: 130px;
            height: 20px;
            background: #ffd700;
            top: 30px;
            z-index: 3;
        }

        .lid {
            position: absolute;
            width: 145px;
            height: 30px;
            background: #ff5c93;
            left: -7px;
            top: 5px;
            border-radius: 7px;
            z-index: 5;
            transition: 1s;
        }

        .gift.open .lid {
            transform: translateY(-90px) rotate(-8deg);
        }

        .message {
            display: none;
            margin-top: 20px;
            animation: pop 1s ease;
        }

        .message h2 {
            color: #ff4081;
            font-size: 30px;
        }

        .message p {
            font-size: 19px;
            color: #444;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }
            100% {
                transform: scale(1);
            }
        }

        .confetti {
            position: fixed;
            top: -20px;
            font-size: 25px;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎉 Happy Birthday Brother! 🎉</h1>
    <p class="subtitle">A special surprise is waiting for you ❤️</p>

    <div class="cake-area">

        <!-- Cake -->
        <div class="cake">

            <div class="candle candle1">
                <div class="flame"></div>
            </div>

            <div class="candle candle2">
                <div class="flame"></div>
            </div>

            <div class="candle candle3">
                <div class="flame"></div>
            </div>

            <div class="cake-top"></div>
            <div class="cream"></div>
            <div class="cake-body"></div>

        </div>

        <!-- Knife -->
        <div class="knife" id="knife">🔪</div>

    </div>

    <button id="knifeButton" onclick="pickKnife()">
        🔪 Pick Up Knife
    </button>

    <!-- Gift -->
    <div class="gift" id="gift">

        <div class="gift-box">

            <div class="box"></div>

            <div class="ribbon-vertical"></div>

            <div class="ribbon-horizontal"></div>

            <div class="lid"></div>

        </div>

    </div>

    <!-- Birthday Message -->
    <div class="message" id="message">

        <h2>🎁 Surprise! 🎁</h2>

        <p>
            Happy Birthday to the best brother! ❤️
            <br>
            May your day be filled with happiness,
            laughter and lots of wonderful memories! 🎂🎉
        </p>

        <h2>🥳 Have an Amazing Birthday! 🥳</h2>

    </div>

</div>


<script>

function pickKnife() {

    const knife = document.getElementById("knife");
    const button = document.getElementById("knifeButton");

    button.innerHTML = "🔪 Cutting the Cake...";

    knife.classList.add("cutting");

    setTimeout(function() {

        // Hide knife
        knife.style.display = "none";

        // Show gift
        const gift = document.getElementById("gift");
        gift.style.display = "block";

        // Open gift
        setTimeout(function() {

            gift.classList.add("open");

            // Show message
            setTimeout(function() {

                document.getElementById("message").style.display = "block";

                createConfetti();

            }, 800);

        }, 500);

        button.style.display = "none";

    }, 1500);
}


// Confetti
function createConfetti() {

    const symbols = ["🎉", "🎊", "✨", "❤️", "🎈", "⭐"];

    for (let i = 0; i < 40; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.innerHTML =
            symbols[Math.floor(Math.random() * symbols.length)];

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.animationDuration =
            (2 + Math.random() * 3) + "s";

        document.body.appendChild(confetti);

        setTimeout(function() {
            confetti.remove();
        }, 5000);
    }
}

</script>

</body>
</html>
